# クライアント確認用ページ（GitHub Pages）を、main への push のたびに作り直して公開する（D-065）。
# ページはパスワード入力画面つき（StatiCrypt）。パスワードはリポジトリのシークレット PREVIEW_PASSWORD。
# シークレットが無いときは build:preview が失敗し、保護なしのページは公開されない。
name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - run: npm run build:preview
        env:
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
